services:
  banco:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cat
      POSTGRES_PASSWORD: cat
      POSTGRES_DB: cat
    # 55432 no hospedeiro de proposito. Esta maquina tem Postgres local nas
    # portas 5432 e 5433 (servicos postgresql-x64-15 e -18) e nao mexemos
    # neles. Porta alta evita colisao com qualquer instalacao existente.
    ports: ["55432:5432"]
    # o Docker Desktop reinicia sozinho (atualização, falta de memória); sem
    # isto o banco ficava parado e a API respondia 500 a tudo, em silêncio
    restart: unless-stopped
    volumes: ["banco:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cat"]
      interval: 5s
      retries: 10

volumes:
  banco:
