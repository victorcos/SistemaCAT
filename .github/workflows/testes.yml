# As três baterias a cada push na main e nas branches das frentes.
# É a conferência depois da integração: scripts/integrar.sh já roda os testes
# na máquina, e isto pega o que escapou (--sem-testes, ambiente diferente).
# Regra: docs/TRABALHO_EM_PARALELO.md.
name: testes

on:
  push:
    branches: [main, "frente/**"]
  pull_request:

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  motor:
    name: motor (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # test_versao compara o VERSAO com a etiqueta mais recente
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e "./backend[dev]"
      - run: python -m pytest -q -p no:cacheprovider
        working-directory: backend

  api:
    name: api (dotnet test)
    runs-on: ubuntu-latest
    services:
      # o mesmo do docker/docker-compose.yml, na mesma porta que os testes procuram
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cat
          POSTGRES_PASSWORD: cat
          POSTGRES_DB: cat
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U cat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: api/global.json
      # os testes da API migram o banco com o Alembic do motor (BancoDeTeste.cs)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -e ./backend
      - run: dotnet test api/SistemaCat.slnx --nologo

  front:
    name: front (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
