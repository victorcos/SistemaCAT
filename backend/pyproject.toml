[project]
name = "sistema-cat"
# FONTE ÚNICA da versão. A API lê daqui (cat/versao.py) e a etiqueta do git
# repete este número: `git tag v<version>`. Bump aqui primeiro, sempre.
version = "0.33.0"
description = "Sistema de apuração das obrigações da CAT — BMS Consultoria Tributária"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "alembic",         # instalar.ps1 e o README rodam `alembic upgrade head`
    "pydantic>=2",
    "pydantic-settings",
    "python-jose[cryptography]",
    "argon2-cffi",
    "bcrypt",          # só para ler resumo antigo durante a migração
    "python-multipart",
    "psycopg[binary]",
    # extração e confronto: parquet entre etapas, DuckDB para agregar e
    # xlsxwriter em memória constante para a entrega (ARQUITETURA §7 e §9)
    "pyarrow",
    "duckdb",
    "xlsxwriter",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "openpyxl"]   # openpyxl só para conferir o xlsx gerado

# Só `cat` é pacote. Sem isto o setuptools acha também tests/, migracoes/ e
# workers/ na raiz e recusa o `pip install -e`: foi o que impediu a instalação
# numa máquina limpa (o ambiente do escritório tinha sido montado à mão).
[tool.setuptools.packages.find]
include = ["cat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
